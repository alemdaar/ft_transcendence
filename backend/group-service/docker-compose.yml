services:
  postgres-b2:
    image: postgres:17
    container_name: groups_database
    restart: always
    environment:
      POSTGRES_USER: transcendence_user
      POSTGRES_PASSWORD: transcendence_password
      POSTGRES_DB: groupsDB
    ports:
      - "5432:5432"
    volumes:
      - /home/sfartah/postgres/group_data:/var/lib/postgresql/data
