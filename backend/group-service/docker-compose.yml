services:
  postgres-b2:
    image: postgres:15-alpine
    container_name: studyPeer_b2_db
    restart: always
    environment:
      POSTGRES_USER: transcendence_user
      POSTGRES_PASSWORD: transcendence_password
      POSTGRES_DB: b2_groups_db
    ports:
      - "5432:5432"
    volumes:
      - b2_db_data:/var/lib/postgresql/data

volumes:
  b2_db_data: