services:
  postgres-b2:
    image: postgres:17
    container_name: groups_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - /home/sfartah/postgres/groups_data:/var/lib/postgresql/data