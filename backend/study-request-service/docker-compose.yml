services:
  postgres:
    image: postgres:15
    container_name: studyreq-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: study_hub
    ports:
      - "5432:5432"
    volumes:
      - /home/ychedmi/Desktop/studyDb:/var/lib/postgresql/data
