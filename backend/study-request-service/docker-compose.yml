services:
  postgres:
    image: postgres:15
    container_name: studyreq-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: study_hub
    ports:
      - "5432:5432"
    volumes:
      - study-request-service_db-data:/var/lib/postgresql/data

volumes:
  study-request-service_db-data:
    external: true

