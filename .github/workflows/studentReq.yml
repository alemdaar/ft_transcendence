name: B3 tests
on: [pull_request]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  peer-part:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: studyuser
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: studydb
        ports: ["2450:5432"]
        options: >-
          --health-cmd "pg_isready -U studyuser -d studydb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://studyuser:secret@localhost:2450/studydb
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    defaults:
      run:
        working-directory: backend/study-request-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm test
      
      - name: Comment on successful tests
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ✅ Study Request Service — CI Passed!

            🎉 All automated tests passed successfully!
      
            ✅ Dependencies installed
            ✅ Prisma Client generated
            ✅ PostgreSQL database initialized
            ✅ Backend tests passed
      
            🚀 Ready for review!
            
